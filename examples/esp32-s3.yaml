esphome:
  name: beszel-esp32-s3

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  framework:
    type: esp-idf

sensor:
  - platform: internal_temperature
    id: soc_temperature
    internal: true
    update_interval: 10s

external_components:
  - source:
      type: local
      path: ../components

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

api:
  encryption:
    key: !secret noise_key

beszel:
  hub: https://beszel.example.com
  token: !secret beszel_token
  key: !secret beszel_hub_public_key
